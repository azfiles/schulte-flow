name: Schulte · rules and scene checks
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'godot/**', 'scripts/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['app/**', 'tests/**', 'godot/**', 'scripts/**', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schulte-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native round tests
        run: |
          mkdir -p build/model
          javac -d build/model app/src/main/java/com/alex/schulteflow/GameSession.java tests/GameSessionTest.java
          java -cp build/model GameSessionTest
      - name: Install pinned engine without export templates
        run: GODOT_ENGINE_ONLY=1 bash scripts/godot/setup.sh
      - name: Godot rules and real scene tests
        run: bash scripts/godot/test.sh
